name: Android quality and security
on:
  push:
  pull_request:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Repeated isolated device test duration (1–180 minutes)'
        default: '1'
permissions:
  contents: read
concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: |
          npm ci --prefix portal-ui --ignore-scripts --no-fund
          npm run build --prefix portal-ui
          npm audit --prefix portal-ui --omit=dev --audit-level=high
          npx --prefix portal-ui playwright install --with-deps chromium
          npm test --prefix portal-ui
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleRelease writeSecurityInventory --max-workers=2
      - run: python3 scripts/check_dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: static-reports
          path: |
            app/build/reports/
            app/build/audit/dependency-findings.json
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --max-workers=2
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes || '1' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 scripts/device_soak.py --minutes "$SOAK_MINUTES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-api-${{ matrix.api }}
          path: app/build/audit/soak/
