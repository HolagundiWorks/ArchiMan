name: Android quality gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Verify pure Measurement Book boundary
        shell: pwsh
        run: ./scripts/verify-product-boundary.ps1

      - name: Test and assemble debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify merged manifest
        shell: pwsh
        run: ./scripts/verify-product-boundary.ps1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
